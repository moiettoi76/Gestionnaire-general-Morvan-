<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Régie — Gestion Immeuble & Activités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#1C2430;
  --charcoal-2:#232D3B;
  --charcoal-3:#2C3846;
  --concrete:#EDEAE2;
  --paper:#FBFAF7;
  --amber:#E8A33D;
  --amber-dim:#C98B2E;
  --slate:#4A6670;
  --green:#5B8266;
  --green-bg:#E7EFE5;
  --brick:#B5533C;
  --brick-bg:#F7E7E1;
  --amber-bg:#FBF0DC;
  --ink:#262420;
  --ink-soft:#5B564C;
  --line:#DAD5C8;
  --line-dark:#3A4554;
  --radius:10px;
  --shadow:0 1px 2px rgba(28,36,48,.06), 0 4px 16px rgba(28,36,48,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}

/* ---------- APP SHELL ---------- */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:248px; flex-shrink:0;
  background:var(--charcoal);
  color:var(--concrete);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  background-image:
    linear-gradient(var(--line-dark) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-dark) 1px, transparent 1px);
  background-size:24px 24px;
  background-position: -1px -1px;
  background-color:var(--charcoal);
}
.sidebar-inner{background:linear-gradient(180deg, rgba(28,36,48,0.97), rgba(28,36,48,0.99)); display:flex; flex-direction:column; height:100%;}
.brand{
  padding:22px 20px 16px 20px; border-bottom:1px solid var(--line-dark);
}
.brand .plot{
  font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; color:var(--amber); text-transform:uppercase; margin-bottom:6px;
}
.brand h1{font-size:19px; color:#fff; line-height:1.15;}
.brand .sub{font-size:11.5px; color:#8b95a3; margin-top:4px;}

.nav{flex:1; overflow-y:auto; padding:10px 10px;}
.nav-group-label{
  font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:#6b7585;
  padding:14px 10px 6px 10px; font-family:'JetBrains Mono',monospace;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px; font-size:13.5px; color:#c7cdd6;
  cursor:pointer; margin-bottom:2px; position:relative; transition:background .12s;
}
.nav-item .num{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#6b7585; width:16px;}
.nav-item:hover{background:var(--charcoal-3); color:#fff;}
.nav-item.active{background:var(--amber); color:#1C2430; font-weight:600;}
.nav-item.active .num{color:#1C2430; opacity:.6;}
.nav-item .badge{
  margin-left:auto; background:var(--brick); color:#fff; font-size:10px; font-weight:700;
  border-radius:20px; padding:1px 7px; font-family:'JetBrains Mono',monospace;
}
.nav-item.active .badge{background:#1C2430; color:var(--amber);}

.sidebar-foot{padding:14px 16px; border-top:1px solid var(--line-dark);}
.role-switch{display:flex; gap:6px; margin-bottom:10px;}
.role-btn{flex:1; padding:6px 4px; font-size:11px; border-radius:6px; border:1px solid var(--line-dark); background:transparent; color:#9aa3af; text-align:center;}
.role-btn.active{background:var(--slate); color:#fff; border-color:var(--slate);}
.user-line{font-size:11.5px; color:#8b95a3; font-family:'JetBrains Mono',monospace;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 32px; border-bottom:1px solid var(--line); background:var(--paper);
  position:sticky; top:0; z-index:5;
}
.topbar h2{font-size:22px;}
.topbar .crumb{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.1em; margin-bottom:3px;}
.topbar-actions{display:flex; gap:8px;}

.content{padding:26px 32px 60px 32px; flex:1;}

/* ---------- COMPONENTS ---------- */
.btn{
  border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 14px;
  border-radius:8px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  transition:all .12s;
}
.btn:hover{border-color:var(--slate); color:var(--slate);}
.btn-primary{background:var(--charcoal); color:#fff; border-color:var(--charcoal);}
.btn-primary:hover{background:var(--amber-dim); border-color:var(--amber-dim); color:#fff;}
.btn-amber{background:var(--amber); color:var(--charcoal); border-color:var(--amber);}
.btn-amber:hover{background:var(--amber-dim); color:#fff;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
.btn-ghost:hover{color:var(--brick); border-color:transparent;}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn-danger{color:var(--brick);}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.grid-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px; margin-bottom:26px;}
.stat-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;
  box-shadow:var(--shadow);
}
.stat-card .n{font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700; line-height:1;}
.stat-card .l{font-size:12px; color:var(--ink-soft); margin-top:6px; text-transform:uppercase; letter-spacing:.05em;}
.stat-card.amber .n{color:var(--amber-dim);}
.stat-card.brick .n{color:var(--brick);}
.stat-card.green .n{color:var(--green);}
.stat-card.slate .n{color:var(--slate);}

.panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:22px; overflow:hidden;}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line);}
.panel-head h3{font-size:15px;}
.panel-body{padding:6px 0;}
.panel-body.pad{padding:16px 18px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:9px 18px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-weight:600;}
td{padding:11px 18px; border-bottom:1px solid #F0EEE7; vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr.row-hover:hover{background:#FAF8F3;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap;}
.pill-dot{width:6px; height:6px; border-radius:50%;}
.pill-amber{background:var(--amber-bg); color:var(--amber-dim);}
.pill-brick{background:var(--brick-bg); color:var(--brick);}
.pill-green{background:var(--green-bg); color:var(--green);}
.pill-slate{background:#E7ECEE; color:var(--slate);}

.empty{padding:36px 20px; text-align:center; color:var(--ink-soft);}
.empty .ico{font-size:26px; margin-bottom:8px;}
.empty .t{font-weight:600; color:var(--ink); font-size:14px; margin-bottom:3px;}
.empty .d{font-size:12.5px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px;}
.tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--ink-soft); border-bottom:2px solid transparent; cursor:pointer;}
.tab.active{color:var(--charcoal); border-bottom-color:var(--amber);}

.field{margin-bottom:13px;}
.field label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px; background:var(--paper); color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--amber); outline-offset:0; border-color:var(--amber);}
.field textarea{resize:vertical; min-height:70px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(28,36,48,.5); display:flex; align-items:flex-start; justify-content:center;
  padding:40px 16px; overflow-y:auto; z-index:100;
}
.modal{background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,.25); animation:pop .15s ease-out;}
@keyframes pop{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line);}
.modal-head h3{font-size:16px;}
.modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:14px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
.close-x{background:none; border:none; font-size:18px; color:var(--ink-soft); padding:4px;}

.zone-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
.zone-card{border:1px solid var(--line); border-radius:10px; padding:14px; background:#fff;}
.zone-card h4{font-size:14px; margin-bottom:8px;}
.seg{display:flex; border-radius:7px; overflow:hidden; border:1px solid var(--line); margin-bottom:8px;}
.seg button{flex:1; padding:7px; font-size:12px; font-weight:600; background:#fff; border:none; color:var(--ink-soft);}
.seg button.on-ok{background:var(--green); color:#fff;}
.seg button.on-bad{background:var(--brick); color:#fff;}
.seg button.on-warn{background:var(--amber); color:var(--charcoal);}

.notice{border-radius:8px; padding:10px 14px; font-size:12.5px; margin-bottom:14px; display:flex; gap:8px; align-items:flex-start;}
.notice-amber{background:var(--amber-bg); color:#7a5417;}
.notice-brick{background:var(--brick-bg); color:var(--brick);}

.searchbar{display:flex; gap:8px; margin-bottom:16px;}
.searchbar input{flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:#fff;}

.kanban{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.kcol{background:#F3F1EB; border-radius:10px; padding:10px;}
.kcol h4{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:4px 6px 10px 6px;}
.kcard{background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 11px; margin-bottom:8px; box-shadow:var(--shadow); cursor:grab;}
.kcard .t{font-weight:600; font-size:13px; margin-bottom:4px;}
.kcard .m{font-size:11px; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center;}

.doc-row{display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid #F0EEE7;}
.doc-ico{width:32px; height:32px; border-radius:7px; background:var(--concrete); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:var(--slate); flex-shrink:0;}

.calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-cell{min-height:88px; border:1px solid var(--line); border-radius:8px; padding:6px; background:#fff;}
.cal-cell.other{background:#F7F5F0; opacity:.5;}
.cal-cell .dn{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:4px;}
.cal-cell.today{border-color:var(--amber); border-width:2px;}
.cal-ev{background:var(--amber-bg); color:var(--amber-dim); font-size:10.5px; border-radius:5px; padding:2px 5px; margin-bottom:3px; cursor:pointer; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cal-head{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--ink-soft); text-align:center; padding-bottom:4px;}

.toast{position:fixed; bottom:24px; right:24px; background:var(--charcoal); color:#fff; padding:12px 18px; border-radius:9px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:200; display:flex; gap:8px; align-items:center;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.chip{background:var(--concrete); font-size:11px; padding:3px 9px; border-radius:20px; color:var(--ink-soft); font-weight:600;}

.locked{filter:grayscale(.4); opacity:.55; pointer-events:none;}
.loading-screen{position:fixed; inset:0; background:var(--charcoal); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; z-index:1000; font-family:'JetBrains Mono',monospace;}

/* ---------- LOCK SCREEN (CODE PIN) ---------- */
.lockscreen{
  position:fixed; inset:0; z-index:2000; background:var(--charcoal);
  background-image:
    linear-gradient(var(--line-dark) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-dark) 1px, transparent 1px);
  background-size:24px 24px; background-position:-1px -1px;
  display:flex; align-items:center; justify-content:center;
}
.lock-card{
  background:linear-gradient(180deg, rgba(28,36,48,.98), rgba(28,36,48,1));
  border:1px solid var(--line-dark); border-radius:14px; padding:34px 32px 28px 32px;
  width:300px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.lock-card .plot{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; color:var(--amber); text-transform:uppercase; margin-bottom:6px;}
.lock-card h1{font-size:19px; color:#fff; margin-bottom:4px;}
.lock-card .sub{font-size:11.5px; color:#8b95a3; margin-bottom:22px;}
.pin-dots{display:flex; justify-content:center; gap:14px; margin-bottom:22px;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid #6b7585; transition:all .1s;}
.pin-dot.filled{background:var(--amber); border-color:var(--amber);}
.pin-dot.shake{animation:pinshake .35s;}
@keyframes pinshake{0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}}
.pin-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:8px;}
.pin-key{
  background:var(--charcoal-3); border:1px solid var(--line-dark); color:#fff;
  border-radius:10px; padding:14px 0; font-size:18px; font-family:'Space Grotesk',sans-serif; font-weight:600;
  transition:background .1s;
}
.pin-key:hover{background:var(--slate);}
.pin-key.pin-clear{font-size:11px; color:#9aa3af; background:transparent; border-color:transparent;}
.pin-key.pin-back{font-size:15px; color:#9aa3af; background:transparent; border-color:transparent;}
.lock-error{font-size:12px; color:var(--brick); min-height:16px; margin-top:6px; font-family:'JetBrains Mono',monospace;}
.lock-setup-note{font-size:11.5px; color:var(--amber); margin-bottom:16px; line-height:1.5;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:#c9c3b3; border-radius:20px;}
@media print{
  .sidebar,.topbar-actions,.btn{display:none !important;}
  .content{padding:0;}
}
@media (max-width:900px){
  .sidebar{position:fixed; left:-260px; z-index:50; transition:left .2s;}
  .sidebar.open{left:0;}
  .row2,.row3{grid-template-columns:1fr;}
  .kanban{grid-template-columns:1fr;}
}
</style>
</head>

<div id="loading" class="loading-screen">
  <div style="font-size:22px;letter-spacing:.1em;">RÉGIE</div>
  <div style="font-size:11px;color:#8b95a3;">Chargement des données…</div>
</div>

<div id="lockscreen" class="lockscreen" style="display:none;">
  <div class="lock-card">
    <div class="plot" id="lock-plot">RÉGIE</div>
    <h1 id="lock-title">Accès protégé</h1>
    <div class="sub" id="lock-sub">Saisissez votre code PIN</div>

    <div class="pin-dots" id="pin-dots"></div>

<div id="app" style="display:none;"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/* =========================================================
   ADAPTATEUR SUPABASE — remplace window.storage (Claude artifacts)
   par une persistance réelle dans une table Supabase (kv_store).
   Nécessite config.js avec SUPABASE_URL / SUPABASE_ANON_KEY.
   ========================================================= */
(function(){
  if(typeof window.APP_CONFIG === 'undefined' || !window.APP_CONFIG.supabaseUrl || !window.APP_CONFIG.supabaseAnonKey){
    console.error("config.js manquant ou incomplet : renseignez supabaseUrl et supabaseAnonKey.");
  }
  const supa = window.supabase.createClient(
    window.APP_CONFIG.supabaseUrl,
    window.APP_CONFIG.supabaseAnonKey
  );

  window.storage = {
    async get(key, shared){
      const { data, error } = await supa.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      if(!data) return null;
      return { key, value: data.value, shared: !!shared };
    },
    async set(key, value, shared){
      const { error } = await supa.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
      if(error){ console.error("Erreur Supabase (set):", error); return null; }
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      const { error } = await supa.from('kv_store').delete().eq('key', key);
      if(error){ console.error("Erreur Supabase (delete):", error); return null; }
      return { key, deleted:true, shared: !!shared };
    },
    async list(prefix, shared){
      let q = supa.from('kv_store').select('key');
      if(prefix) q = q.like('key', prefix+'%');
      const { data, error } = await q;
      if(error){ console.error("Erreur Supabase (list):", error); return null; }
      return { keys: (data||[]).map(r=>r.key), prefix, shared: !!shared };
    }
  };
})();
</script>

let DB = null;
let VIEW = "dashboard";
let VIEWSTATE = {}; // ephemeral per-view UI state (filters, tabs..)

/* ---------------- PERSISTENCE ---------------- */
async function loadDB(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    if(res && res.value){ DB = JSON.parse(res.value); migrateDB(); return; }
  }catch(e){ /* not found */ }
  DB = seedData();
  await saveDB();
}
function migrateDB(){
  // Garantit la présence de la configuration modifiable même sur des données sauvegardées avant son ajout
  const defaults = seedData().config;
  DB.config = Object.assign({}, defaults, DB.config||{});
  if(!DB.config.pin) DB.config.pin = defaults.pin;
}
async function saveDB(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(DB), false); }
  catch(e){ console.error("Erreur sauvegarde", e); toast("⚠ Sauvegarde impossible (hors-ligne)"); }
}
function log(texte){
  DB.journal.unshift({id:uid(), date:new Date().toISOString(), texte, user: currentUser().nom});
  DB.journal = DB.journal.slice(0,300);
}
function currentUser(){
  return DB.users.find(u=>u.id===DB.currentUserId) || DB.users[0];
}
function isAdmin(){ return currentUser().role === "admin"; }

async function persistAndRender(msg){
  await saveDB();
  if(msg) toast(msg);
  render();
}

/* ---------------- TOAST ---------------- */
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2200);
}

/* ================= EXPORT HELPERS ================= */
function exportCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  toast("Export CSV téléchargé");
}
function printPage(){ window.print(); }
function mailtoLink(to, subject, body){
  return `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function viewAgenda(){
  if(!VIEWSTATE.calMode) VIEWSTATE.calMode = 'mois';
  if(!VIEWSTATE.refDate) VIEWSTATE.refDate = new Date();
  setTopbarActions(`<button class="btn btn-primary" onclick="openRdvForm()">+ Nouveau rendez-vous</button>`);

  const modes = ['jour','semaine','mois'];
  setContent(`
    <div class="tabs">${modes.map(m=>`<div class="tab ${VIEWSTATE.calMode===m?'active':''}" onclick="setCalMode('${m}')">Vue ${m}</div>`).join('')}</div>
    <div id="agenda-nav" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <button class="btn btn-sm" onclick="shiftCal(-1)">←</button>
      <div style="font-weight:600; font-family:'Space Grotesk';" id="agenda-label"></div>
      <button class="btn btn-sm" onclick="shiftCal(1)">→</button>
      <button class="btn btn-sm" onclick="VIEWSTATE.refDate=new Date(); render();">Aujourd'hui</button>
    </div>
    <div id="agenda-body"></div>
  `);
  renderAgendaBody();
}
function setCalMode(m){ VIEWSTATE.calMode=m; render(); }
function shiftCal(dir){
  const d = VIEWSTATE.refDate;
  if(VIEWSTATE.calMode==='jour') d.setDate(d.getDate()+dir);
  else if(VIEWSTATE.calMode==='semaine') d.setDate(d.getDate()+dir*7);
  else d.setMonth(d.getMonth()+dir);
  render();
}
function rdvsOnDate(iso){ return DB.rdvs.filter(r=>r.date===iso).sort((a,b)=>a.heure.localeCompare(b.heure)); }
function renderAgendaBody(){
  const label = document.getElementById('agenda-label');
  const body = document.getElementById('agenda-body');
  const ref = VIEWSTATE.refDate;
  if(VIEWSTATE.calMode==='jour'){
    const iso = ref.toISOString().slice(0,10);
    label.textContent = ref.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const evs = rdvsOnDate(iso);
    body.innerHTML = `<div class="panel"><div class="panel-body">${evs.length ? `<table><tbody>${evs.map(r=>rdvRow(r)).join('')}</tbody></table>` : emptyState('📭','Journée libre','Aucun rendez-vous ce jour.')}</div></div>`;
  } else if(VIEWSTATE.calMode==='semaine'){
    const start = new Date(ref); const day = (start.getDay()+6)%7; start.setDate(start.getDate()-day);
    const days = Array.from({length:7}, (_,i)=>{ const d=new Date(start); d.setDate(start.getDate()+i); return d; });
    label.textContent = `Semaine du ${days[0].toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} au ${days[6].toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}`;
    body.innerHTML = `<div class="calendar">${days.map(d=>{
      const iso = d.toISOString().slice(0,10);
      const isToday = iso===todayISO();
      const evs = rdvsOnDate(iso);
      return `<div class="cal-cell ${isToday?'today':''}" style="min-height:160px;">
        <div class="dn">${d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}</div>
        ${evs.map(e=>`<div class="cal-ev" onclick="openRdvDetail('${e.id}')">${e.heure} ${escapeHtml(e.objet)}</div>`).join('')}
      </div>`;
    }).join('')}</div>`;
  } else {
    const y = ref.getFullYear(), m = ref.getMonth();
    label.textContent = ref.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    const first = new Date(y,m,1); const startDay=(first.getDay()+6)%7;
    const gridStart = new Date(first); gridStart.setDate(first.getDate()-startDay);
    const cells = Array.from({length:42},(_,i)=>{ const d=new Date(gridStart); d.setDate(gridStart.getDate()+i); return d; });
    const heads = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    body.innerHTML = `<div class="calendar">${heads.map(h=>`<div class="cal-head">${h}</div>`).join('')}
      ${cells.map(d=>{
        const iso = d.toISOString().slice(0,10);
        const other = d.getMonth()!==m;
        const isToday = iso===todayISO();
        const evs = rdvsOnDate(iso);
        return `<div class="cal-cell ${other?'other':''} ${isToday?'today':''}">
          <div class="dn">${d.getDate()}</div>
          ${evs.slice(0,3).map(e=>`<div class="cal-ev" onclick="openRdvDetail('${e.id}')">${e.heure} ${escapeHtml(e.objet)}</div>`).join('')}
          ${evs.length>3?`<div style="font-size:10px;color:var(--ink-soft);">+${evs.length-3} autres</div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }
}
function rdvRow(r){
  return `<tr class="row-hover"><td class="mono" style="width:60px;">${r.heure}</td>
    <td><b>${escapeHtml(r.objet)}</b><br><span style="color:var(--ink-soft);font-size:12px;">${escapeHtml(r.personne)} · ${escapeHtml(r.lieu)}</span></td>
    <td style="text-align:right;">${r.statut==='realise'?'<span class="pill pill-green">Réalisé</span>':'<span class="pill pill-slate">Planifié</span>'}</td>
    <td style="text-align:right; white-space:nowrap;">
      <button class="btn btn-ghost btn-sm" onclick="openRdvDetail('${r.id}')">Détail</button>
      <button class="btn btn-ghost btn-sm" onclick="openRdvForm('${r.id}')">✎</button>
      <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteRdv('${r.id}')">🗑</button>
    </td></tr>`;
}

  openModal(r?'Modifier le rendez-vous':'Nouveau rendez-vous', `

    </div>
    <div class="field"><label>Objet</label><input id="f-objet" value="${escapeHtml(r?.objet||'')}" placeholder="Ex : Visite technique ascenseur"></div>
    <div class="row2">

function viewEmails(){
  setTopbarActions(`<button class="btn btn-primary" onclick="openEmailForm()">+ Suivre un email</button>`);
  setContent(`
    <div class="panel"><div class="panel-body">
      <table><thead><tr><th>Destinataire</th><th>Objet</th><th>Envoyé le</th><th>Relances</th><th>Statut</th><th></th></tr></thead>
      <tbody>${DB.emails.length ? DB.emails.slice().sort((a,b)=>b.dateEnvoi.localeCompare(a.dateEnvoi)).map(e=>{
        const jours = -daysBetween(e.dateEnvoi);
        let paliers = [];
        DB.config.relanceJalons.forEach(p=>{ if(jours>=p && e.statut==='en_attente') paliers.push(p); });
        const relanceDue = paliers.some(p => !e.relances.some(r=>r.type===p+' jours'));
        return `<tr class="row-hover"><td>${escapeHtml(e.destinataire)}</td><td><b>${escapeHtml(e.objet)}</b></td>
        <td class="mono">${fmtDate(e.dateEnvoi)} <span style="color:var(--ink-soft);">(${jours}j)</span></td>
        <td>${e.relances.length ? e.relances.map(r=>`<span class="chip">${r.type} · ${fmtDate(r.date)}</span>`).join(' ') : '—'} ${relanceDue?`<div class="pill pill-brick" style="margin-top:4px;">Relance due</div>`:''}</td>
        <td>${pillEmail(e.statut)}</td>
        <td style="text-align:right; white-space:nowrap;">
          ${e.statut==='en_attente'?`<a class="btn btn-ghost btn-sm" href="${mailtoLink(e.destinataire,'Relance : '+e.objet,'Bonjour,\\n\\nJe me permets de revenir vers vous concernant : '+e.objet+'.\\n\\nCordialement,')}" onclick="registerRelance('${e.id}')">✉ Relancer</a>`:''}
          <button class="btn btn-ghost btn-sm" onclick="toggleEmailStatut('${e.id}')">${e.statut==='en_attente'?'✓ Résolu':'↺ Rouvrir'}</button>
          <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteEmail('${e.id}')">🗑</button>
        </td></tr>`;
      }).join('') : `<tr><td colspan="6">${emptyState('✉️','Aucun email suivi','Suivez vos emails importants pour ne manquer aucune relance.')}</td></tr>`}</tbody></table>
    </div></div>
  `);
}
function openEmailForm(){
  openModal('Suivre un nouvel email', `
    <div class="field"><label>Destinataire</label><input id="f-dest" placeholder="nom@exemple.fr"></div>
    <div class="field"><label>Objet</label><input id="f-objet"></div>
    <div class="field"><label>Date d'envoi</label><input type="date" id="f-date" value="${todayISO()}"></div>
  `, `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveEmail()">Enregistrer</button>`);
}
async function saveEmail(){
  const data = {destinataire:fval('f-dest'), objet:fval('f-objet'), dateEnvoi:fval('f-date')};
  if(!data.destinataire || !data.objet){ toast('Destinataire et objet requis'); return; }
  DB.emails.push({id:uid(), statut:'en_attente', relances:[], ...data});
  log(`Email suivi : ${data.objet}`);
  closeModal(); await persistAndRender('Email ajouté au suivi');
}
async function registerRelance(id){
  const e = DB.emails.find(x=>x.id===id);
  const jours = -daysBetween(e.dateEnvoi);
  const jalons = DB.config.relanceJalons.slice().sort((a,b)=>b-a);
  const palier = jalons.find(p=>jours>=p) || jalons[jalons.length-1];
  let type = palier+' jours';
  if(!e.relances.some(r=>r.type===type)) e.relances.push({date:todayISO(), type});
  log(`Relance envoyée : ${e.objet}`);
  await saveDB(); render();
}
async function toggleEmailStatut(id){
  const e = DB.emails.find(x=>x.id===id);
  e.statut = e.statut==='en_attente' ? 'resolu' : 'en_attente';
  log(`Email marqué ${e.statut==='resolu'?'résolu':'en attente'} : ${e.objet}`);
  await persistAndRender();
}
async function deleteEmail(id){
  const e = DB.emails.find(x=>x.id===id);
  DB.emails = DB.emails.filter(x=>x.id!==id);
  log(`Suivi email supprimé : ${e?.objet||''}`);
  await persistAndRender('Supprimé');
}

function viewStatistiques(){
  setTopbarActions(`<button class="btn" onclick="exportStatsCSV()">⇩ Export Excel/CSV</button> <button class="btn" onclick="printPage()">🖨 Imprimer</button>`);
  const controlesEffectues = DB.controlesMenage.length + DB.controlesPC.length;
  const missionsTerminees = DB.missions.filter(m=>m.statut==='termine').length;
  const dossiersOuverts = DB.dossiers.filter(d=>d.statut!=='cloture').length;
  const dossiersClotures = DB.dossiers.filter(d=>d.statut==='cloture').length;
  const retards = DB.missions.filter(m=>m.statut!=='termine' && daysBetween(m.dateLimite)<0).length + DB.dossiers.filter(d=>d.statut!=='cloture' && daysBetween(d.echeance)<0).length;
  const relances = DB.emails.reduce((a,e)=>a+e.relances.length,0);
  const nonConformeMenage = DB.controlesMenage.filter(c=>c.etat==='non_conforme').length;
  const defectueuxPC = DB.controlesPC.filter(c=>c.etat==='defectueux').length;

  setContent(`
    <div class="grid-cards">
      <div class="stat-card slate"><div class="n">${controlesEffectues}</div><div class="l">Contrôles effectués</div></div>
      <div class="stat-card green"><div class="n">${missionsTerminees}</div><div class="l">Missions terminées</div></div>
      <div class="stat-card brick"><div class="n">${dossiersOuverts}</div><div class="l">Dossiers ouverts</div></div>
      <div class="stat-card green"><div class="n">${dossiersClotures}</div><div class="l">Dossiers clôturés</div></div>
      <div class="stat-card brick"><div class="n">${retards}</div><div class="l">Retards</div></div>
      <div class="stat-card amber"><div class="n">${relances}</div><div class="l">Relances emails envoyées</div></div>
    </div>
    <div class="row2">
      <div class="panel"><div class="panel-head"><h3>Répartition des missions</h3></div><div class="panel-body pad">${barChart([
        ['À faire', DB.missions.filter(m=>m.statut==='a_faire').length, 'var(--slate)'],
        ['En cours', DB.missions.filter(m=>m.statut==='en_cours').length, 'var(--amber)'],
        ['Terminé', missionsTerminees, 'var(--green)'],
        ['Reporté', DB.missions.filter(m=>m.statut==='reporte').length, 'var(--brick)'],
      ])}</div></div>
      <div class="panel"><div class="panel-head"><h3>Qualité des contrôles</h3></div><div class="panel-body pad">${barChart([
        ['Ménage conforme', DB.controlesMenage.length-nonConformeMenage, 'var(--green)'],
        ['Ménage non conforme', nonConformeMenage, 'var(--brick)'],
        ['Parties communes bon', DB.controlesPC.filter(c=>c.etat==='bon').length, 'var(--green)'],
        ['Parties communes défectueux', defectueuxPC, 'var(--brick)'],
      ])}</div></div>
    </div>
  `);
}
function barChart(rows){
  const max = Math.max(1, ...rows.map(r=>r[1]));
  return rows.map(([label,val,color])=>`
    <div style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><span>${label}</span><b class="mono">${val}</b></div>
      <div style="background:#F0EEE7; border-radius:6px; height:9px; overflow:hidden;"><div style="width:${(val/max*100)}%; background:${color}; height:100%; border-radius:6px;"></div></div>
    </div>`).join('');
}
function exportStatsCSV(){
  exportCSV('statistiques.csv', [
    ['Indicateur','Valeur'],
    ['Contrôles effectués', DB.controlesMenage.length + DB.controlesPC.length],
    ['Missions terminées', DB.missions.filter(m=>m.statut==='termine').length],
    ['Dossiers ouverts', DB.dossiers.filter(d=>d.statut!=='cloture').length],
    ['Dossiers clôturés', DB.dossiers.filter(d=>d.statut==='cloture').length],
    ['Relances emails', DB.emails.reduce((a,e)=>a+e.relances.length,0)],
  ]);
}

    <div class="notice notice-amber">🔐 Connexion sécurisée active · Sauvegarde automatique activée · Ce journal trace les actions effectuées dans l'application.</div>
    <div class="panel"><div class="panel-body">
      <table><thead><tr><th>Horodatage</th><th>Utilisateur</th><th>Action</th></tr></thead>
      <tbody>${DB.journal.map(j=>`<tr class="row-hover"><td class="mono">${fmtDateTime(j.date)}</td><td>${escapeHtml(j.user)}</td><td>${escapeHtml(j.texte)}</td></tr>`).join('')}</tbody></table>
    </div></div>
  `);
}

/* ================================================================
   MODULE 12 — UTILISATEURS
   ================================================================ */
function viewUtilisateurs(){
  if(!isAdmin()){ setContent(emptyState('🔒','Accès réservé','Ce module est réservé aux administrateurs.')); return; }
  setTopbarActions(`<button class="btn btn-primary" onclick="openUserForm()">+ Nouvel utilisateur</button>`);
  setContent(`
    <div class="panel"><div class="panel-body">
      <table><thead><tr><th>Nom</th><th>Rôle</th><th>Droits</th><th></th></tr></thead>
      <tbody>${DB.users.map(u=>`
        <tr class="row-hover"><td><b>${escapeHtml(u.nom)}</b></td><td>${u.role==='admin'?'<span class="pill pill-amber">Administrateur</span>':'<span class="pill pill-slate">Agent</span>'}</td>
        <td style="font-size:12px; color:var(--ink-soft);">${u.role==='admin'?'Gestion complète, statistiques, export':'Contrôles, rendez-vous, missions, comptes rendus'}</td>
        <td style="text-align:right; white-space:nowrap;"><button class="btn btn-ghost btn-sm" onclick="openUserForm('${u.id}')">✎ Modifier</button><button class="btn btn-ghost btn-sm btn-danger" onclick="deleteUser('${u.id}')">🗑</button></td></tr>
      `).join('')}</tbody></table>
    </div></div>
  `);
}
function openUserForm(id){
  const u = id ? DB.users.find(x=>x.id===id) : null;
  openModal(u?'Modifier l’utilisateur':'Nouvel utilisateur', `
    <div class="field"><label>Nom</label><input id="f-nom" placeholder="Prénom Nom" value="${escapeHtml(u?.nom||'')}"></div>
    <div class="field"><label>Rôle</label><select id="f-role">
      <option value="agent" ${u?.role==='agent'?'selected':''}>Agent</option>
      <option value="admin" ${u?.role==='admin'?'selected':''}>Administrateur</option>
    </select></div>
  `, `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveUser('${id||''}')">${u?'Enregistrer':'Créer'}</button>`);
}
async function saveUser(id){
  const nom = fval('f-nom'); if(!nom){ toast('Le nom est requis'); return; }
  const role = fval('f-role');
  if(id){ const u = DB.users.find(x=>x.id===id); Object.assign(u, {nom, role}); log(`Utilisateur modifié : ${nom}`); }
  else { DB.users.push({id:uid(), nom, role}); log(`Utilisateur créé : ${nom}`); }
  closeModal(); await persistAndRender('Utilisateur enregistré');
}
async function deleteUser(id){
  if(DB.users.length<=1){ toast('Impossible de supprimer le dernier utilisateur'); return; }
  const u = DB.users.find(x=>x.id===id);
  DB.users = DB.users.filter(x=>x.id!==id);
  if(DB.currentUserId===id) DB.currentUserId = DB.users[0].id;
  log(`Utilisateur supprimé : ${u?.nom||''}`);
  await persistAndRender('Utilisateur supprimé');
}

   MODULE 13 — PARAMÈTRES (tout modifiable)

  setTopbarActions(`<button class="btn" onclick="resetToDefaults()">↺ Réinitialiser les listes par défaut</button>`);
  setContent(`
    <div class="notice notice-amber">Personnalisez ici le nom de votre régie, ainsi que les zones, éléments, types et catégories utilisés dans les autres modules. Toute modification s'applique immédiatement.</div>

    <div class="panel">
      <div class="panel-head"><h3>Identité de l'application</h3></div>
      <div class="panel-body pad">
        <div class="row2">
          <div class="field"><label>Nom affiché</label><input id="cfg-brandName" value="${escapeHtml(DB.config.brandName)}" onchange="updateConfigField('brandName', this.value)"></div>
          <div class="field"><label>Sous-titre</label><input id="cfg-brandSub" value="${escapeHtml(DB.config.brandSub)}" onchange="updateConfigField('brandSub', this.value)"></div>
        </div>
        <div class="field"><label>Référence / repère de plan</label><input id="cfg-planRef" value="${escapeHtml(DB.config.planRef)}" onchange="updateConfigField('planRef', this.value)"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Sécurité — Code PIN</h3></div>
      <div class="panel-body pad">
        <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:12px;">L'application est protégée par un code PIN demandé à chaque ouverture. Vous pouvez le modifier ci-dessous.</div>
        <div class="row2">
          <div class="field"><label>Code PIN actuel</label><input type="password" inputmode="numeric" maxlength="8" id="cfg-pin-old" placeholder="••••"></div>
          <div class="field"><label>Nouveau code PIN (4 à 8 chiffres)</label><input type="password" inputmode="numeric" maxlength="8" id="cfg-pin-new" placeholder="••••"></div>
        </div>
        <div class="field"><label>Confirmer le nouveau code</label><input type="password" inputmode="numeric" maxlength="8" id="cfg-pin-confirm" placeholder="••••"></div>
        <button class="btn btn-amber btn-sm" onclick="changePin()">Modifier le code PIN</button>
      </div>
    </div>

    ${configListPanel('zonesMenage', 'Zones — Contrôle ménage', 'Ex : Cave, Terrasse…')}
    ${configListPanel('elementsPC', 'Éléments — Contrôle parties communes', 'Ex : Vidéosurveillance…')}
    ${configListPanel('typesDossier', 'Types de dossiers', 'Ex : Assurances…')}
    ${configListPanel('categoriesNotes', 'Catégories de notes', 'Ex : Sécurité…')}

    <div class="panel">
      <div class="panel-head"><h3>Jalons de relance des emails (en jours)</h3></div>
      <div class="panel-body pad">
        <div class="chip-row" style="margin-top:0;">
          ${DB.config.relanceJalons.slice().sort((a,b)=>a-b).map(j=>`<span class="chip">${j} jours <span style="cursor:pointer; color:var(--brick); font-weight:700;" onclick="removeJalon(${j})">✕</span></span>`).join('') || '<span style="color:var(--ink-soft); font-size:12px;">Aucun jalon</span>'}
        </div>
        <div style="display:flex; gap:8px; margin-top:12px; max-width:260px;">
          <input type="number" min="1" id="new-jalon" placeholder="Nombre de jours">
          <button class="btn btn-sm" onclick="addJalon()">Ajouter</button>
        </div>
      </div>
    </div>
  `);
}
function configListPanel(key, label, placeholder){
  const items = DB.config[key];
  return `<div class="panel">
    <div class="panel-head"><h3>${label}</h3><span class="chip">${items.length} élément(s)</span></div>
    <div class="panel-body pad">
      <div class="chip-row" style="margin-top:0;">
        ${items.map((v,i)=>`<span class="chip">${escapeHtml(v)} <span style="cursor:pointer; color:var(--brick); font-weight:700;" onclick="removeConfigItem('${key}', ${i})">✕</span></span>`).join('') || '<span style="color:var(--ink-soft); font-size:12px;">Aucun élément — la liste est vide.</span>'}
      </div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <input id="new-${key}" placeholder="${placeholder}" style="flex:1;" onkeydown="if(event.key==='Enter'){addConfigItem('${key}');}">
        <button class="btn btn-sm" onclick="addConfigItem('${key}')">Ajouter</button>
      </div>
    </div>
  </div>`;
}
async function updateConfigField(field, value){
  DB.config[field] = value;
  log(`Paramètre modifié : ${field}`);
  await saveDB(); render();
}
async function addConfigItem(key){
  const input = document.getElementById('new-'+key);
  const val = input.value.trim();
  if(!val) return;
  if(DB.config[key].some(v=>v.toLowerCase()===val.toLowerCase())){ toast('Cet élément existe déjà'); return; }
  DB.config[key].push(val);
  log(`Élément ajouté (${key}) : ${val}`);
  await persistAndRender('Ajouté');
}
async function removeConfigItem(key, index){
  const val = DB.config[key][index];
  DB.config[key].splice(index,1);
  log(`Élément supprimé (${key}) : ${val}`);
  await persistAndRender('Supprimé');
}
async function addJalon(){
  const v = parseInt(fval('new-jalon'));
  if(!v || v<1){ toast('Indiquez un nombre de jours valide'); return; }
  if(DB.config.relanceJalons.includes(v)){ toast('Ce jalon existe déjà'); return; }
  DB.config.relanceJalons.push(v);
  log(`Jalon de relance ajouté : ${v} jours`);
  await persistAndRender('Ajouté');
}
async function removeJalon(v){
  DB.config.relanceJalons = DB.config.relanceJalons.filter(x=>x!==v);
  log(`Jalon de relance supprimé : ${v} jours`);
  await persistAndRender('Supprimé');
}
async function changePin(){
  const oldPin = fval('cfg-pin-old');
  const newPin = fval('cfg-pin-new');
  const confirmPin = fval('cfg-pin-confirm');
  if(oldPin !== DB.config.pin){ toast('Code PIN actuel incorrect'); return; }
  if(!/^[0-9]{4,8}$/.test(newPin)){ toast('Le nouveau code doit contenir 4 à 8 chiffres'); return; }
  if(newPin !== confirmPin){ toast('Les deux codes ne correspondent pas'); return; }
  DB.config.pin = newPin;
  log('Code PIN modifié');
  await persistAndRender('Code PIN modifié');
}
async function resetToDefaults(){
  const d = seedData().config;
  DB.config.zonesMenage = d.zonesMenage.slice();
  DB.config.elementsPC = d.elementsPC.slice();
  DB.config.typesDossier = d.typesDossier.slice();
  DB.config.categoriesNotes = d.categoriesNotes.slice();
  DB.config.relanceJalons = d.relanceJalons.slice();
  log('Listes de référence réinitialisées par défaut');
  await persistAndRender('Listes réinitialisées');
}

/* ================================================================
   VERROUILLAGE — CODE PIN
   ================================================================ */
let PIN_BUFFER = "";
let PIN_MODE = "unlock"; // "unlock" | "setup" | "confirm-new"
let PIN_TEMP_NEW = "";

function startApp(){
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  render();
}

function showLockScreen(mode){
  PIN_MODE = mode || "unlock";
  PIN_BUFFER = "";
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='none';
  document.getElementById('lockscreen').style.display='flex';
  document.getElementById('lock-plot').textContent = (DB.config.planRef||'RÉGIE');
  const title = document.getElementById('lock-title');
  const sub = document.getElementById('lock-sub');
  const note = document.getElementById('lock-setup-note');
  note.innerHTML = "";
  if(PIN_MODE === "setup"){
    title.textContent = escapeHtml(DB.config.brandName || 'Régie');
    sub.textContent = "Créez votre code PIN (4 chiffres)";
    note.innerHTML = `<div class="lock-setup-note">Première utilisation : définissez un code PIN pour protéger l'accès à l'application.</div>`;
  } else if(PIN_MODE === "confirm-new"){
    title.textContent = "Confirmez le code";
    sub.textContent = "Saisissez à nouveau le nouveau code";
  } else {
    title.textContent = escapeHtml(DB.config.brandName || 'Régie');
    sub.textContent = "Saisissez votre code PIN";
  }
  document.getElementById('lock-error').textContent = "";
  renderPinDots();
  renderPinKeypad();
}
function renderPinDots(){
  const len = DB.config.pin ? DB.config.pin.length : 4;
  const target = (PIN_MODE==='setup' && PIN_TEMP_NEW==='') || PIN_MODE==='setup' ? 4 : (PIN_MODE==='confirm-new' ? PIN_TEMP_NEW.length : len);
  const count = Math.max(target, 4);
  document.getElementById('pin-dots').innerHTML = Array.from({length:count}, (_,i)=>
    `<div class="pin-dot ${i<PIN_BUFFER.length?'filled':''}"></div>`
  ).join('');
}
function renderPinKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','clear','0','back'];
  document.getElementById('pin-keypad').innerHTML = keys.map(k=>{
    if(k==='clear') return `<button class="pin-key pin-clear" onclick="pinClear()">Effacer</button>`;
    if(k==='back') return `<button class="pin-key pin-back" onclick="pinBackspace()">⌫</button>`;
    return `<button class="pin-key" onclick="pinPress('${k}')">${k}</button>`;
  }).join('');
}
function pinPress(digit){
  const maxLen = PIN_MODE==='unlock' ? (DB.config.pin?DB.config.pin.length:4) : 4;
  if(PIN_BUFFER.length >= Math.max(maxLen,4) && PIN_MODE!=='unlock') return;
  PIN_BUFFER += digit;
  renderPinDots();
  const requiredLen = PIN_MODE==='unlock' ? (DB.config.pin?DB.config.pin.length:4) : 4;
  if(PIN_BUFFER.length >= requiredLen){
    setTimeout(()=>submitPin(), 120);
  }
}
function pinBackspace(){ PIN_BUFFER = PIN_BUFFER.slice(0,-1); renderPinDots(); }
function pinClear(){ PIN_BUFFER = ""; renderPinDots(); }
function pinShakeError(msg){
  document.getElementById('lock-error').textContent = msg;
  const dots = document.getElementById('pin-dots');
  dots.querySelectorAll('.pin-dot').forEach(d=>d.classList.add('shake'));
  setTimeout(()=>{ PIN_BUFFER=""; renderPinDots(); }, 260);
}
function submitPin(){
  if(PIN_MODE === 'unlock'){
    if(PIN_BUFFER === DB.config.pin){
      document.getElementById('lockscreen').style.display='none';
      startApp();
    } else {
      pinShakeError("Code incorrect, réessayez");
    }
  } else if(PIN_MODE === 'setup'){
    if(PIN_BUFFER.length < 4){ pinShakeError("4 chiffres minimum"); return; }
    PIN_TEMP_NEW = PIN_BUFFER;
    showLockScreen('confirm-new');
  } else if(PIN_MODE === 'confirm-new'){
    if(PIN_BUFFER === PIN_TEMP_NEW){
      DB.config.pin = PIN_BUFFER;
      PIN_TEMP_NEW = "";
      saveDB();
      document.getElementById('lockscreen').style.display='none';
      startApp();
      toast('Code PIN défini');
    } else {
      pinShakeError("Les codes ne correspondent pas");
      PIN_TEMP_NEW = "";
      setTimeout(()=>showLockScreen('setup'), 400);
    }
  }
}
function lockApp(){
  showLockScreen('unlock');
}

// Permet aussi la saisie au clavier physique
document.addEventListener('keydown', (e)=>{
  const ls = document.getElementById('lockscreen');
  if(!ls || ls.style.display==='none') return;
  if(e.key>='0' && e.key<='9') pinPress(e.key);
  else if(e.key==='Backspace') pinBackspace();
  else if(e.key==='Escape') pinClear();
});

  await loadDB();
  if(!DB.currentUserId) DB.currentUserId = DB.users[0].id;

  if(!DB.config.pin){
    showLockScreen('setup');
  } else {
    showLockScreen('unlock');
  }

  // re-render calendar body without full nav rebuild on internal nav clicks
  const origGoTo = goTo;
})();
